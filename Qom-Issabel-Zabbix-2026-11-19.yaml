zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 7df96b2a4c8e41d9a3f5b7c0e2d6a891
      name: 'Templates/Telephony'
  templates:
    - uuid: 8ae07c4d2b3f4a6c9d1e0f2a3b4c5d6e
      template: 'Template Qom Issabel'
      name: 'Template Qom Issabel'
      description: |
        Issabel 5 / Asterisk 18.19 / Zabbix 8.0.
        Requires Agent2 user parameters/scripts already configured on Qom-Issabel.
        SIP peer JSON key: issabel.sip.peers.raw
      groups:
        - name: 'Templates/Telephony'
      items:
        - uuid: 9bf18d5e3c4a4b7d8e2f1a3b4c5d6e7f
          name: 'Asterisk SIP peers raw data'
          type: ZABBIX_PASSIVE
          key: issabel.sip.peers.raw
          delay: 30s
          history: 1d
          value_type: TEXT
        - uuid: c2e41a8b6f7d4e0a9b5c4d6e7f8091a2
          name: 'Asterisk process count'
          type: ZABBIX_PASSIVE
          key: 'proc.num[asterisk]'
          delay: 30s
          history: 7d
          value_type: UNSIGNED
      discovery_rules:
        - uuid: d3f52b9c7a8e4f1b9c6d5e7f8091a2b3
          name: 'Issabel SIP peer discovery'
          type: DEPENDENT
          key: issabel.sip.peers.discovery.lld
          delay: '0'
          lifetime: 7d
          master_item:
            key: issabel.sip.peers.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  if (!obj || !Array.isArray(obj.data)) {
                      throw 'Invalid SIP peer JSON: expected data array';
                  }
                  return JSON.stringify(obj.data);
          item_prototypes:
            - uuid: f5b74d9e0a234c8f9b6d1e2a3c4f5b60
              name: 'SIP peer {#PEERNAME}: IP address'
              type: DEPENDENT
              key: 'issabel.sip.peer.ip["{#PEERNAME}"]'
              delay: '0'
              history: 7d
              value_type: CHAR
              master_item:
                key: issabel.sip.peers.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      for (var i = 0; i < obj.data.length; i++) {
                          if (obj.data[i].name === "{#PEERNAME}" ||
                              obj.data[i]["{#PEERNAME}"] === "{#PEERNAME}") {
                              return obj.data[i].ip || obj.data[i]["{#PEERHOST}"] || "";
                          }
                      }
                      return "";
            - uuid: e4a63c8d9f124b7e8a5c6d0f1b2e3a49
              name: 'SIP peer {#PEERNAME}: status'
              type: DEPENDENT
              key: 'issabel.sip.peer.status["{#PEERNAME}"]'
              delay: '0'
              history: 7d
              value_type: CHAR
              master_item:
                key: issabel.sip.peers.raw
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      for (var i = 0; i < obj.data.length; i++) {
                          if (obj.data[i].name === "{#PEERNAME}") {
                              return obj.data[i].status || "UNKNOWN";
                          }
                      }
                      return "UNKNOWN";
          trigger_prototypes:
            - uuid: 71a63c8d9f124b7e8a5c6d0f1b2e3a49
              expression: 'last(/Template Qom Issabel/issabel.sip.peer.status["{#PEERNAME}"])="OFFLINE"'
              name: 'Issabel: SIP peer {#PEERNAME} OFFLINE ({#PEERTYPE})'
              priority: HIGH
      tags:
        - tag: service
          value: telephony
        - tag: vendor
          value: issabel
      dashboards:
        - uuid: 6c9d0e1f2a3b4456b7c8d9e0f0011223
          name: 'Qom Issabel Overview'
          display_period: '30'
          auto_start: 'NO'
          pages:
            - name: Overview
              display_period: '30'
              widgets:
                - type: problems
                  name: 'Issabel active problems'
                  x: '0'
                  y: '0'
                  width: '72'
                  height: '8'
                  fields:
                    - type: STRING
                      name: reference
                      value: ISSPB
                - type: clock
                  name: 'Current time'
                  x: '0'
                  y: '8'
                  width: '18'
                  height: '4'
                  fields:
                    - type: INTEGER
                      name: clock_type
                      value: '1'
                    - type: STRING
                      name: time
                      value: ''
                    - type: STRING
                      name: reference
                      value: ISSCL
  triggers:
    - uuid: 5b8c9d0e1f2a4345b6c7d8e9f0011223
      name: 'Issabel: Agent data missing'
      expression: 'nodata(/Template Qom Issabel/issabel.sip.peers.raw,3m)=1'
      priority: HIGH
      description: 'No SIP peer data has been received for three minutes.'
    - uuid: 4a7b8c9d0e1f4234a5b6c7d8e9f00112
      name: 'Issabel: Asterisk process is not running'
      expression: 'last(/Template Qom Issabel/proc.num[asterisk])=0'
      priority: HIGH
      description: 'Asterisk process is not running.'
