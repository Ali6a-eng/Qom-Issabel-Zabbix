zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'Qom Issabel - Management'
      display_period: '30'
      auto_start: '0'
      pages:
        - name: 'Overview'
          widgets:
            - type: problems
              name: 'Current Problems'
              x: '0'
              y: '0'
              width: '24'
              height: '5'
              fields:
                - type: INTEGER
                  name: show
                  value: '3'
            - type: clock
              name: 'Local Time'
              x: '0'
              y: '9'
              width: '6'
              height: '4'
            - type: actionlog
              name: 'Recent Actions'
              x: '6'
              y: '9'
              width: '18'
              height: '4'
