                - type: topitems
                  name: 'Extension SIP Ports'
                  x: '0'
                  y: '12'
                  width: '36'
                  height: '10'
                  fields:
                    - type: STRING
                      name: columns.0.items.0
                      value: 'Extension *: SIP port'
                    - type: INTEGER
                      name: columns.0.display_value_as
                      value: '1'
                    - type: INTEGER
                      name: layout
                      value: '1'
                    - type: INTEGER
                      name: show_problems
                      value: '2'
                    - type: INTEGER
                      name: item_ordering_order_by
                      value: '2'
                    - type: INTEGER
                      name: item_ordering_limit
                      value: '100'
                    - type: INTEGER
                      name: rf_rate
                      value: '30'
                - type: topitems
                  name: 'Extension RTT (ms)'
                  x: '36'
                  y: '12'
                  width: '36'
                  height: '10'
                  fields:
                    - type: STRING
                      name: columns.0.items.0
                      value: 'Extension *: RTT'
                    - type: INTEGER
                      name: columns.0.display_value_as
                      value: '1'
                    - type: INTEGER
                      name: layout
                      value: '1'
                    - type: INTEGER
                      name: show_problems
                      value: '2'
                    - type: INTEGER
                      name: item_ordering_order_by
                      value: '2'
                    - type: INTEGER
                      name: item_ordering_limit
                      value: '100'
                    - type: INTEGER
                      name: rf_rate
                      value: '30'
            - name: '03 - SIP Trunks'
              widgets:
                - type: honeycomb
                  name: 'SIP Trunk Status'
                  x: '0'
                  y: '0'
                  width: '24'
                  height: '10'
                  fields:
