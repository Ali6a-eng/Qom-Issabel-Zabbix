                      value: '2'
                    - type: STRING
                      name: columns.0.base_color
                      value: '9E9E9E'
                    - type: STRING
                      name: columns.0.highlights.0.color
                      value: '00C853'
                    - type: STRING
                      name: columns.0.highlights.0.pattern
                      value: '^ONLINE\\b'
                    - type: STRING
